name: decoder-framework-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run acceptance
      - run: npm run audit
      - run: npm run benchmark:v1.1
      - run: npm run benchmark:v1.2
      - run: npm run benchmark:v1.3
      - run: npm run benchmark:v1.4
