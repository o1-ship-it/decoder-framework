name: decoder-framework-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run acceptance
      - run: npm run audit
      - run: npm run benchmark:v1.1
      - run: npm run benchmark:v1.2
      - run: npm run benchmark:v1.3
      - run: npm run benchmark:v1.4
      - run: npm run benchmark:v1.5
      - run: npm run benchmark:v1.6
      - run: npm run benchmark:v1.7
      - run: npm run benchmark:v2.0
      - run: npm run benchmark:v2.1
      - run: npm run benchmark:v2.2
      - run: npm run benchmark:v2.3
      - run: npm run benchmark:v2.4
      - run: npm run benchmark:v3.0
      - run: npm run benchmark:v3.1
      - run: npm run benchmark:v3.2
      - run: npm run benchmark:v3.3
      - run: npm run benchmark:v3.4
      - run: npm run benchmark:v3.5
